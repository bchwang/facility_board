<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시설물 관리대장 · 양지파인리조트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#14202E;          /* 헤더 잉크 네이비 */
    --paper:#F4F6F5;        /* 배경 */
    --line:#E1E5EA;
    --text:#1F2937;
    --dim:#6B7280;
    --blue:#2563EB;         /* 일반 시설물 */
    --red:#DC2626;          /* 안전 위험 요소 */
    --orange:#EA580C;       /* 유지 보수 필요 */
    --green:#16A34A;        /* 조치 완료 */
    --excel:#1D6F42;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Pretendard,'맑은 고딕','Malgun Gothic',system-ui,sans-serif;
    background:var(--paper); color:var(--text); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);}

  /* ── 상단 바 ─────────────────────────────── */
  .topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px;}
  .topbar .sub{font-size:13px;color:#9FB0C2;}
  .topbar .spacer{flex:1;}
  .btn{border:0;border-radius:7px;padding:9px 15px;font-weight:600;}
  .btn-add{background:#fff;color:var(--ink);}
  .btn-open{background:#33475B;color:#fff;}
  .btn-excel{background:var(--excel);color:#fff;}
  .notice{background:#FFF7E8;border-bottom:1px solid #F0E0BE;color:#6B5424;font-size:13.5px;padding:11px 20px;line-height:1.6;}
  .notice b{color:#4A3714;}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #7DD3FC;outline-offset:2px;}

  /* ── 요약 + 필터 ─────────────────────────── */
  .board{max-width:1400px;margin:0 auto;padding:18px 20px 60px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .chip{
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;display:flex;align-items:center;gap:7px;color:var(--text);
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;}
  .chip .n{color:var(--dim);font-variant-numeric:tabular-nums;}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip[aria-pressed="true"] .n{color:#9FB0C2;}
  .search{flex:1;min-width:180px;max-width:280px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;}

  /* ── 표 ─────────────────────────────────── */
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{
    background:#F8FAFB;text-align:left;font-size:13px;font-weight:700;color:#48566A;
    padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:12px;border-bottom:1px solid #EFF2F4;vertical-align:top;font-size:14px;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover{background:#FAFBFC;}
  .st{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;font-size:13px;}
  .st .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .place{font-weight:600;}
  .facility{color:var(--dim);font-size:13px;}
  .memo{color:#374151;white-space:pre-wrap;word-break:break-word;}
  .done-memo{color:var(--green);}
  .date{color:var(--dim);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .aging{color:var(--red);font-weight:600;font-size:12px;}
  .rowbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;color:#48566A;}
  .rowbtn+.rowbtn{margin-left:5px;}
  .rowbtn.del{color:var(--red);border-color:#F3D3D3;}
  .empty{padding:56px 20px;text-align:center;color:var(--dim);}
  .empty b{display:block;color:var(--text);margin-bottom:6px;font-size:16px;}

  /* ── 입력 창 ─────────────────────────────── */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,32,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .backdrop.on{display:flex;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:620px;max-height:92vh;overflow:auto;}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .modal header h2{margin:0;font-size:17px;}
  .modal header button{margin-left:auto;background:none;border:0;font-size:22px;color:var(--dim);line-height:1;}
  .form{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .f{display:flex;flex-direction:column;gap:6px;}
  .f.wide{grid-column:1 / -1;}
  .f label{font-size:13px;font-weight:600;color:#48566A;}
  .f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;}
  .f textarea{min-height:74px;resize:vertical;}
  .hint{font-size:12px;color:var(--dim);}
  .modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
  .btn-save{background:var(--ink);color:#fff;}
  .btn-cancel{background:#fff;color:#48566A;border:1px solid var(--line);}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:60;}
  .toast.on{opacity:1;}

  /* ── 모바일 ─────────────────────────────── */
  @media (max-width:860px){
    .board{padding:14px 12px 60px;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{border-bottom:1px solid var(--line);padding:12px 14px;}
    tbody tr:last-child{border-bottom:0;}
    td{border:0;padding:3px 0;}
    td[data-label]:not(:empty)::before{content:attr(data-label);display:block;font-size:12px;color:var(--dim);margin-bottom:2px;}
    td.act{padding-top:10px;}
    .form{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>시설물 관리대장</h1>
    <div class="sub">양지파인리조트 시설관리팀</div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-add" id="btnAdd">항목 추가</button>
  <button class="btn btn-open" id="btnOpen">엑셀 불러오기</button>
  <button class="btn btn-excel" id="btnExcel">엑셀로 저장</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
</div>

<div class="notice" id="notice">
  이 화면은 관리맵과 따로 도는 대장입니다. 관리맵에 있는 자료는 건드리지 않습니다.
  대신 여기서 적은 내용은 창을 닫으면 사라지니, 작업이 끝나면 <b>엑셀로 저장</b>을 눌러 파일로 보관하세요.
  다음에 이어서 하실 때는 <b>엑셀 불러오기</b>로 그 파일을 열면 됩니다.
</div>

<div class="board">
  <div class="filters" id="filters"></div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th style="width:110px">상태</th>
          <th style="width:180px">위치 / 시설물</th>
          <th style="width:70px">파트</th>
          <th>확인 내용</th>
          <th>조치 내용</th>
          <th style="width:110px">등록일</th>
          <th style="width:110px">조치일</th>
          <th style="width:80px">담당자</th>
          <th style="width:130px">관리</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <b>표시할 항목이 없습니다</b>
      항목 추가를 눌러 현장에서 확인한 내용을 등록하세요.
    </div>
  </div>
</div>

<!-- 입력 / 수정 창 -->
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header>
      <h2 id="modalTitle">항목 추가</h2>
      <button id="btnClose" aria-label="닫기">&times;</button>
    </header>
    <div class="form">
      <div class="f">
        <label for="f_status">상태</label>
        <select id="f_status"></select>
      </div>
      <div class="f">
        <label for="f_part">담당 파트</label>
        <select id="f_part"></select>
      </div>
      <div class="f">
        <label for="f_place">위치 (동 / 구역)</label>
        <input id="f_place" placeholder="예) 오렌지동 1현관">
      </div>
      <div class="f">
        <label for="f_facility">시설물명</label>
        <input id="f_facility" placeholder="예) 온수 순환펌프 2호">
      </div>
      <div class="f wide">
        <label for="f_issue">확인 내용</label>
        <textarea id="f_issue" placeholder="현장에서 확인한 상태를 적습니다."></textarea>
      </div>
      <div class="f">
        <label for="f_found">등록일</label>
        <input id="f_found" type="date">
      </div>
      <div class="f">
        <label for="f_owner">담당자</label>
        <input id="f_owner" placeholder="예) 홍길동">
      </div>
      <div class="f wide">
        <label for="f_action">조치 내용</label>
        <textarea id="f_action" placeholder="조치한 내용을 적습니다. 조치 완료로 바꾸면 조치일이 자동 입력됩니다."></textarea>
      </div>
      <div class="f">
        <label for="f_done">조치일</label>
        <input id="f_done" type="date">
      </div>
      <div class="f">
        <label for="f_note">비고</label>
        <input id="f_note" placeholder="예) 자재 입고 대기">
      </div>
      <div class="f">
        <label for="f_lat">위도</label>
        <input id="f_lat" inputmode="decimal" placeholder="지도 마커 좌표 (선택)">
      </div>
      <div class="f">
        <label for="f_lng">경도</label>
        <input id="f_lng" inputmode="decimal" placeholder="지도 마커 좌표 (선택)">
      </div>
      <div class="f wide hint">위치와 시설물명은 반드시 입력해 주세요.</div>
    </div>
    <footer>
      <button class="btn btn-cancel" id="btnCancel">취소</button>
      <button class="btn btn-save" id="btnSave">저장</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   1) 기준 정보 — 관리맵 마커 색상 체계와 동일하게 맞춰 두었습니다.
   ══════════════════════════════════════════════════════════ */
var STATUS = {
  general: { label:'일반 시설물',    color:'#2563EB', todo:false },
  risk:    { label:'안전 위험 요소', color:'#DC2626', todo:true  },
  repair:  { label:'유지 보수 필요', color:'#EA580C', todo:true  },
  done:    { label:'조치 완료',      color:'#16A34A', todo:false }
};
var PARTS = ['기계','전기','영선','환경','방재','미화'];

/* ══════════════════════════════════════════════════════════
   2) 데이터 연결부 — 여기만 바꾸면 관리맵 DB와 그대로 붙습니다.
      아래는 화면 확인용 임시 저장(메모리)이고,
      Firebase 연결 예시는 파일 맨 아래 주석을 그대로 옮겨 쓰면 됩니다.
   ══════════════════════════════════════════════════════════ */
var items = [
  { id:'s1', status:'risk',    part:'전기', place:'주차타워',        facility:'비상발전기 200kW',
    issue:'장기 미가동 상태. 축전지 및 냉각계통 점검 필요.', found:'2026-08-20',
    action:'', done:'', owner:'', note:'안전보건 협조 요청', lat:'', lng:'' },
  { id:'s2', status:'repair',  part:'기계', place:'기계실',          facility:'콘도 온수 순환펌프 2호',
    issue:'배관·밸브류 노후로 누수 흔적 확인.', found:'2026-08-25',
    action:'', done:'', owner:'', note:'결재 진행 중', lat:'', lng:'' },
  { id:'s3', status:'done',    part:'기계', place:'오렌지동 1현관',  facility:'보일러',
    issue:'난방 미작동 민원 접수.', found:'2026-08-11',
    action:'순환펌프 교체 후 정상 운전 확인.', done:'2026-08-14', owner:'김주임', note:'', lat:'', lng:'' },
  { id:'s4', status:'general', part:'방재', place:'클럽하우스',      facility:'소화펌프실',
    issue:'월 1회 정기 점검 대상.', found:'2026-08-01',
    action:'', done:'', owner:'', note:'', lat:'', lng:'' }
];

var DataSource = {
  list:   function(){ return Promise.resolve(items.slice()); },
  save:   function(item){
    var i = items.findIndex(function(v){ return v.id === item.id; });
    if (i >= 0) { items[i] = item; } else { items.push(item); }
    return Promise.resolve(item);
  },
  remove: function(id){
    items = items.filter(function(v){ return v.id !== id; });
    return Promise.resolve();
  }
};

/* ══════════════════════════════════════════════════════════
   3) 화면 그리기
   ══════════════════════════════════════════════════════════ */
var rows = [];            // 화면에 표시 중인 전체 목록
var filter = 'all';       // all | todo | risk | repair | done | general
var keyword = '';
var editingId = null;
var dirty = false;        // 엑셀로 저장하지 않은 변경이 있는지

var $ = function(id){ return document.getElementById(id); };

function todayStr(){
  var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function daysBetween(a, b){
  if (!a || !b) return '';
  var ms = new Date(b).getTime() - new Date(a).getTime();
  if (isNaN(ms)) return '';
  return Math.max(0, Math.round(ms / 86400000));
}
function isTodo(item){ return STATUS[item.status] && STATUS[item.status].todo; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
  });
}
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

function counts(){
  var c = { all:rows.length, todo:0, risk:0, repair:0, done:0, general:0 };
  rows.forEach(function(r){ c[r.status]++; if (isTodo(r)) c.todo++; });
  return c;
}

function drawFilters(){
  var c = counts();
  var defs = [
    { key:'todo',    name:'해야 할 일', color:'#EA580C' },
    { key:'risk',    name:'안전 위험',   color:STATUS.risk.color },
    { key:'repair',  name:'유지 보수',   color:STATUS.repair.color },
    { key:'done',    name:'조치 완료',   color:STATUS.done.color },
    { key:'general', name:'일반 시설물', color:STATUS.general.color },
    { key:'all',     name:'전체',        color:'#94A3B8' }
  ];
  $('filters').innerHTML =
    defs.map(function(d){
      return '<button class="chip" data-f="' + d.key + '" aria-pressed="' + (filter === d.key) + '">' +
             '<span class="dot" style="background:' + d.color + '"></span>' + d.name +
             ' <span class="n">' + c[d.key] + '</span></button>';
    }).join('') +
    '<input class="search" id="search" type="search" placeholder="위치·시설물·내용 검색" value="' + esc(keyword) + '">';

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(el){
    el.onclick = function(){ filter = el.dataset.f; draw(); };
  });
  var s = $('search');
  s.oninput = function(){ keyword = s.value.trim(); drawTable(); };
}

function visibleRows(){
  return rows.filter(function(r){
    var okFilter =
      filter === 'all'  ? true :
      filter === 'todo' ? isTodo(r) : r.status === filter;
    if (!okFilter) return false;
    if (!keyword) return true;
    var hay = [r.place, r.facility, r.issue, r.action, r.owner, r.note].join(' ').toLowerCase();
    return hay.indexOf(keyword.toLowerCase()) >= 0;
  }).sort(function(a, b){
    if (isTodo(a) !== isTodo(b)) return isTodo(a) ? -1 : 1;   // 할 일 먼저
    return (b.found || '').localeCompare(a.found || '');       // 최근 등록 먼저
  });
}

function drawTable(){
  var list = visibleRows();
  $('empty').hidden = list.length > 0;
  $('tbody').innerHTML = list.map(function(r){
    var st = STATUS[r.status] || STATUS.general;
    var aging = isTodo(r) ? daysBetween(r.found, todayStr()) : '';
    return '<tr>' +
      '<td data-label="상태"><span class="st"><span class="dot" style="background:' + st.color + '"></span>' + st.label + '</span></td>' +
      '<td data-label="위치 / 시설물"><div class="place">' + esc(r.place) + '</div><div class="facility">' + esc(r.facility) + '</div></td>' +
      '<td data-label="파트">' + esc(r.part) + '</td>' +
      '<td data-label="확인 내용"><div class="memo">' + esc(r.issue) + '</div>' +
        (r.note ? '<div class="facility">비고: ' + esc(r.note) + '</div>' : '') + '</td>' +
      '<td data-label="조치 내용"><div class="memo done-memo">' + esc(r.action) + '</div></td>' +
      '<td data-label="등록일"><span class="date">' + esc(r.found) + '</span>' +
        (aging !== '' ? '<div class="aging">' + aging + '일 경과</div>' : '') + '</td>' +
      '<td data-label="조치일"><span class="date">' + esc(r.done) + '</span></td>' +
      '<td data-label="담당자">' + esc(r.owner) + '</td>' +
      '<td class="act">' +
        '<button class="rowbtn" data-edit="' + r.id + '">수정</button>' +
        '<button class="rowbtn del" data-del="' + r.id + '">삭제</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function(b){
    b.onclick = function(){ openModal(b.dataset.edit); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
    b.onclick = function(){ removeItem(b.dataset.del); };
  });
}

function draw(){ drawFilters(); drawTable(); }

/* ══════════════════════════════════════════════════════════
   4) 입력 / 수정 / 삭제
   ══════════════════════════════════════════════════════════ */
function fillSelects(){
  $('f_status').innerHTML = Object.keys(STATUS).map(function(k){
    return '<option value="' + k + '">' + STATUS[k].label + '</option>';
  }).join('');
  $('f_part').innerHTML = PARTS.map(function(p){
    return '<option value="' + p + '">' + p + '</option>';
  }).join('');
}

function openModal(id){
  editingId = id || null;
  var r = id ? rows.find(function(v){ return v.id === id; }) : null;
  $('modalTitle').textContent = r ? '항목 수정' : '항목 추가';
  $('f_status').value   = r ? r.status : 'repair';
  $('f_part').value     = r ? r.part   : PARTS[0];
  $('f_place').value    = r ? r.place || '' : '';
  $('f_facility').value = r ? r.facility || '' : '';
  $('f_issue').value    = r ? r.issue || '' : '';
  $('f_found').value    = r ? r.found || '' : todayStr();
  $('f_action').value   = r ? r.action || '' : '';
  $('f_done').value     = r ? r.done || '' : '';
  $('f_owner').value    = r ? r.owner || '' : '';
  $('f_note').value     = r ? r.note || '' : '';
  $('f_lat').value      = r ? r.lat || '' : '';
  $('f_lng').value      = r ? r.lng || '' : '';
  $('backdrop').classList.add('on');
  setTimeout(function(){ $('f_place').focus(); }, 40);
}
function closeModal(){ $('backdrop').classList.remove('on'); editingId = null; }

$('f_status').addEventListener('change', function(){
  if (this.value === 'done' && !$('f_done').value) $('f_done').value = todayStr();
});

function saveItem(){
  var place = $('f_place').value.trim();
  var facility = $('f_facility').value.trim();
  if (!place || !facility){ toast('위치와 시설물명을 입력해 주세요.'); $('f_place').focus(); return; }

  var item = {
    id: editingId || ('m' + Date.now()),
    status: $('f_status').value,
    part: $('f_part').value,
    place: place,
    facility: facility,
    issue: $('f_issue').value.trim(),
    found: $('f_found').value,
    action: $('f_action').value.trim(),
    done: $('f_done').value,
    owner: $('f_owner').value.trim(),
    note: $('f_note').value.trim(),
    lat: $('f_lat').value.trim(),
    lng: $('f_lng').value.trim()
  };
  if (item.status === 'done' && !item.done) item.done = todayStr();

  DataSource.save(item).then(function(){
    dirty = true;
    toast(editingId ? '수정했습니다.' : '등록했습니다.');
    closeModal();
    load();
  }).catch(function(e){ toast('저장하지 못했습니다. ' + e); });
}

function removeItem(id){
  var r = rows.find(function(v){ return v.id === id; });
  if (!r) return;
  if (!confirm(r.place + ' ' + r.facility + ' 항목을 삭제할까요?')) return;
  DataSource.remove(id).then(function(){ dirty = true; toast('삭제했습니다.'); load(); })
    .catch(function(e){ toast('삭제하지 못했습니다. ' + e); });
}

/* ══════════════════════════════════════════════════════════
   5) 엑셀 내보내기 — 조치 필요 / 조치 완료 / 전체 목록 3개 시트
   ══════════════════════════════════════════════════════════ */
function sheetFrom(title, header, body, widths){
  var stamp = todayStr() + ' 출력';
  var aoa = [[title], [stamp + '   ' + body.length + '건'], header].concat(
    body.length ? body : [['해당 항목이 없습니다.']]
  );
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(function(w){ return { wch:w }; });
  ws['!merges'] = [
    { s:{ r:0, c:0 }, e:{ r:0, c:header.length - 1 } },
    { s:{ r:1, c:0 }, e:{ r:1, c:header.length - 1 } }
  ];
  if (body.length){
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({
      s:{ r:2, c:0 }, e:{ r:2 + body.length, c:header.length - 1 }
    }) };
  }
  return ws;
}

function exportExcel(){
  var todo = rows.filter(isTodo).sort(function(a,b){ return (a.found||'').localeCompare(b.found||''); });
  var fin  = rows.filter(function(r){ return r.status === 'done'; })
                 .sort(function(a,b){ return (b.done||'').localeCompare(a.done||''); });

  var wb = XLSX.utils.book_new();

  // 시트 1 — 현재 해야 할 일
  XLSX.utils.book_append_sheet(wb, sheetFrom(
    '시설물 관리대장 / 현재 해야 할 일',
    ['번호','상태','위치','시설물명','담당 파트','확인 내용','등록일','경과일','담당자','비고'],
    todo.map(function(r, i){
      return [ i+1, STATUS[r.status].label, r.place, r.facility, r.part,
               r.issue, r.found, daysBetween(r.found, todayStr()), r.owner, r.note ];
    }),
    [6,14,18,22,10,44,12,8,10,20]
  ), '해야 할 일');

  // 시트 2 — 조치 완료
  XLSX.utils.book_append_sheet(wb, sheetFrom(
    '시설물 관리대장 / 조치 완료',
    ['번호','위치','시설물명','담당 파트','확인 내용','조치 내용','등록일','조치일','소요일','담당자'],
    fin.map(function(r, i){
      return [ i+1, r.place, r.facility, r.part, r.issue, r.action,
               r.found, r.done, daysBetween(r.found, r.done), r.owner ];
    }),
    [6,18,22,10,36,40,12,12,8,10]
  ), '조치 완료');

  // 시트 3 — 전체 목록
  XLSX.utils.book_append_sheet(wb, sheetFrom(
    '시설물 관리대장 / 전체 목록',
    ['번호','상태','위치','시설물명','담당 파트','확인 내용','등록일','조치 내용','조치일','담당자','비고','위도','경도'],
    rows.map(function(r, i){
      return [ i+1, STATUS[r.status].label, r.place, r.facility, r.part, r.issue,
               r.found, r.action, r.done, r.owner, r.note, r.lat, r.lng ];
    }),
    [6,14,18,22,10,36,12,36,12,10,18,12,12]
  ), '전체 목록');

  XLSX.writeFile(wb, '시설물관리대장_' + todayStr().replace(/-/g, '') + '.xlsx');
  dirty = false;
  toast('엑셀 파일로 저장했습니다.');
}

/* ── 저장해 둔 엑셀 파일 다시 불러오기 ──────────────────── */
var LABEL_TO_STATUS = {};
Object.keys(STATUS).forEach(function(k){ LABEL_TO_STATUS[STATUS[k].label] = k; });

function normalizeDate(v){
  if (v === '' || v == null) return '';
  if (v instanceof Date) {
    var p = function(n){ return String(n).padStart(2,'0'); };
    return v.getFullYear() + '-' + p(v.getMonth()+1) + '-' + p(v.getDate());
  }
  if (typeof v === 'number') return normalizeDate(new Date(Math.round((v - 25569) * 86400000)));
  var s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var d = new Date(s);
  return isNaN(d.getTime()) ? s : normalizeDate(d);
}

function importExcel(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
      var ws = wb.Sheets['전체 목록'] || wb.Sheets[wb.SheetNames[0]];
      var aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });

      var hi = -1;
      for (var i = 0; i < aoa.length; i++){
        if (aoa[i].indexOf('위치') >= 0 && aoa[i].indexOf('시설물명') >= 0){ hi = i; break; }
      }
      if (hi < 0){ toast('표의 머리글(위치·시설물명)을 찾지 못했습니다.'); return; }

      var head = aoa[hi].map(function(h){ return String(h).trim(); });
      var col = function(name){ return head.indexOf(name); };
      var get = function(row, name){ var c = col(name); return c < 0 ? '' : String(row[c] == null ? '' : row[c]).trim(); };
      var getDate = function(row, name){ var c = col(name); return c < 0 ? '' : normalizeDate(row[c]); };

      var loaded = [];
      for (var r = hi + 1; r < aoa.length; r++){
        var row = aoa[r];
        var place = get(row, '위치'), facility = get(row, '시설물명');
        if (!place && !facility) continue;
        var doneDate = getDate(row, '조치일');
        var status = LABEL_TO_STATUS[get(row, '상태')] || (doneDate ? 'done' : 'repair');
        loaded.push({
          id: 'm' + Date.now() + '_' + r,
          status: status, part: get(row, '담당 파트') || PARTS[0],
          place: place, facility: facility,
          issue: get(row, '확인 내용'), found: getDate(row, '등록일'),
          action: get(row, '조치 내용'), done: doneDate,
          owner: get(row, '담당자'), note: get(row, '비고'),
          lat: get(row, '위도'), lng: get(row, '경도')
        });
      }
      if (!loaded.length){ toast('불러올 내용이 없습니다.'); return; }
      if (dirty && !confirm('지금 화면의 내용은 지워지고 파일 내용으로 바뀝니다. 계속할까요?')) return;

      items = loaded;
      dirty = false;
      load();
      toast(loaded.length + '건을 불러왔습니다.');
    } catch (err) {
      toast('파일을 읽지 못했습니다. ' + err);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ══════════════════════════════════════════════════════════
   6) 시작
   ══════════════════════════════════════════════════════════ */
function load(){
  DataSource.list().then(function(list){ rows = list; draw(); })
    .catch(function(e){ toast('목록을 불러오지 못했습니다. ' + e); });
}

$('btnAdd').onclick    = function(){ openModal(null); };
$('btnExcel').onclick  = exportExcel;
$('btnOpen').onclick   = function(){ $('fileInput').click(); };
$('fileInput').onchange = function(){
  if (this.files && this.files[0]) importExcel(this.files[0]);
  this.value = '';
};
window.addEventListener('beforeunload', function(e){
  if (!dirty) return;
  e.preventDefault();          // 엑셀로 저장하지 않은 내용이 있으면 확인 창
  e.returnValue = '';
});
$('btnSave').onclick   = saveItem;
$('btnCancel').onclick = closeModal;
$('btnClose').onclick  = closeModal;
$('backdrop').onclick  = function(e){ if (e.target === $('backdrop')) closeModal(); };
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

fillSelects();
load();
